name: Bug report
description: Something in MKMN does not work as it should.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for the report. For a security problem, do not use this form: see SECURITY.md.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Click ...
        3. See ...
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device model
      placeholder: e.g. Surface Laptop 7, Snapdragon X Elite
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows build
      description: Run `winver` and copy the version and OS build.
      placeholder: e.g. 24H2, OS build 26100.4061
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: MKMN version
      placeholder: e.g. v0.0.2
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Full log
      description: Click "Copy full log" in MKMN and paste it here. Check it first and remove anything private.
      render: text
  - type: textarea
    id: more
    attributes:
      label: Anything else
      description: Screenshots, the model you used, or anything that may help.
