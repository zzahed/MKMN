# Weekly update pull requests for the JavaScript packages, the Rust crates and the
# workflow actions. Each one runs CI like any other pull request; nothing merges on its own.
version: 2
# The pnpm version comes from "packageManager" in package.json, which Dependabot also
# reads. Without it Dependabot uses pnpm 11, which ignores the "pnpm" field in
# package.json and so drops the overrides block from the lockfiles it regenerates.
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    groups:
      # vitest and its coverage package must stay on the same version: they arrive together
      vitest:
        patterns: ["vitest", "@vitest/*"]
  - package-ecosystem: cargo
    directory: /src-tauri
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
