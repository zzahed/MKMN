name: MKMN Windows ARM64 verification

# Restricted candidate-branch build: verify installer, CI and CodeQL on exact head,
# then publish a GitHub prerelease (never Latest) with unsigned binary, SHA-256 and provenance.
# The publishing job alone receives contents:write. Stable publication is out of scope.
on:
  workflow_dispatch:
  push:
    branches: [release/v0.0.3-rc.1]

permissions:
  contents: read

jobs:
  windows-arm64:
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: 1.100.0
          targets: aarch64-pc-windows-msvc
      - name: Install and check
        shell: pwsh
        run: |
          pnpm --ignore-workspace install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm rebuild esbuild
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm typecheck
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm run licenses
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm run build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm run build:sidecar
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # after the sidecar build, so the live sidecar check runs instead of skipping
          $env:MKMN_REQUIRE_SIDECAR = "1"
          pnpm test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          exit $LASTEXITCODE
      - name: Bundle the Node sidecar runtime
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File ".\scripts\Bundle-Sidecar.ps1"
          exit $LASTEXITCODE
      - name: Build the Tauri host
        shell: pwsh
        run: |
          cargo build --release --target aarch64-pc-windows-msvc --manifest-path src-tauri/Cargo.toml
          exit $LASTEXITCODE
      - name: Rust host tests
        shell: pwsh
        run: |
          cargo test --release --target aarch64-pc-windows-msvc --manifest-path src-tauri/Cargo.toml
          exit $LASTEXITCODE
      - name: NSIS installer
        shell: pwsh
        run: |
          $nsis = Get-Command makensis -ErrorAction SilentlyContinue
          if (-not $nsis) {
            $candidate = "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
            if (-not (Test-Path $candidate)) { choco install nsis -y --no-progress }
            $nsis = Get-Command makensis -ErrorAction SilentlyContinue
            if (-not $nsis -and (Test-Path $candidate)) { $nsis = @{ Source = $candidate } }
          }
          if (-not $nsis) { throw "NSIS is not available on the runner." }
          $version = (node -p "require('./package.json').version").Trim()
          & $nsis.Source "/DVERSION=$version" installer.nsi
          exit $LASTEXITCODE
      - name: Validate the packaged installer
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File ".\scripts\Validate-Installer.ps1"
          exit $LASTEXITCODE
      - name: Write SHA-256 and build provenance
        shell: pwsh
        run: |
          $version = (node -p "require('./package.json').version").Trim()
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $installer = "dist/MKMN-$version-arm64-Setup.exe"
          if (-not (Test-Path -LiteralPath $installer)) { throw "No installer: $installer" }
          $sha = (Get-FileHash -Algorithm SHA256 -LiteralPath $installer).Hash.ToLowerInvariant()
          "$sha  $(Split-Path $installer -Leaf)" | Set-Content -Path "$installer.sha256" -Encoding ascii
          "commit=$env:GITHUB_SHA" | Set-Content -Path "dist/MKMN-$version-build.txt" -Encoding ascii
          "version=$version" | Add-Content -Path "dist/MKMN-$version-build.txt" -Encoding ascii
          "installer_sha256=$sha" | Add-Content -Path "dist/MKMN-$version-build.txt" -Encoding ascii
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: MKMN-Windows-ARM64-unsigned
          path: |
            dist/MKMN-*-arm64-Setup.exe
            dist/MKMN-*-arm64-Setup.exe.sha256
            dist/MKMN-*-build.txt
          if-no-files-found: error

  publish-prerelease:
    name: Publish controlled pilot prerelease
    needs: windows-arm64
    if: github.event_name == 'push' && github.ref == 'refs/heads/release/v0.0.3-rc.1' && github.repository == 'zzahed/MKMN'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify this exact revision passed CI and CodeQL
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess, sys, time
          repo, sha = os.environ["GITHUB_REPOSITORY"], os.environ["GITHUB_SHA"]
          for attempt in range(60):
              data = json.loads(subprocess.check_output(
                  ["gh", "api", f"repos/{repo}/actions/runs?per_page=100"], text=True))
              matches = {}
              for run in data.get("workflow_runs", []):
                  if run.get("head_sha") == sha and run.get("name") in ("ci", "codeql"):
                      name = run["name"]
                      if name not in matches or run["id"] > matches[name]["id"]:
                          matches[name] = run
              print(f"Gate {attempt + 1}: " + ", ".join(
                  f"{name}={matches.get(name, {}).get('conclusion') or matches.get(name, {}).get('status', 'missing')}"
                  for name in ("ci", "codeql")), flush=True)
              if all(matches.get(n, {}).get("conclusion") == "success" for n in ("ci", "codeql")):
                  print(f"Both required workflows passed at exact SHA {sha}", flush=True)
                  break
              if any(matches.get(n, {}).get("status") == "completed"
                     and matches[n].get("conclusion") != "success" for n in ("ci", "codeql")):
                  sys.exit("Refusing publication: CI or CodeQL did not succeed")
              if attempt == 59:
                  sys.exit("Timed out waiting for successful CI and CodeQL on this exact SHA")
              time.sleep(30)
          PY
      - name: Download built installer and provenance from this run
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name MKMN-Windows-ARM64-unsigned --dir dist
      - name: Verify installer SHA-256 and build provenance
        run: |
          set -euo pipefail
          test "$(python3 -c 'import json; print(json.load(open("package.json"))["version"])')" = "0.0.3-rc.1"
          cd dist
          test -s MKMN-0.0.3-rc.1-arm64-Setup.exe
          sha256sum -c MKMN-0.0.3-rc.1-arm64-Setup.exe.sha256
          # PowerShell writes CRLF on Windows. Compare normalized lines without mutating the published asset.
          sed 's/\r$//' MKMN-0.0.3-rc.1-build.txt | grep -Fx "commit=$GITHUB_SHA"
          sed 's/\r$//' MKMN-0.0.3-rc.1-build.txt | grep -Fx "version=0.0.3-rc.1"
      - name: Publish GitHub prerelease (not Latest)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v0.0.3-rc.1 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Refusing to overwrite an existing v0.0.3-rc.1 release"
            exit 1
          fi
          gh release create v0.0.3-rc.1 \
            dist/MKMN-0.0.3-rc.1-arm64-Setup.exe \
            dist/MKMN-0.0.3-rc.1-arm64-Setup.exe.sha256 \
            dist/MKMN-0.0.3-rc.1-build.txt \
            --target "$GITHUB_SHA" \
            --title "MKMN AI v0.0.3-rc.1 - Controlled HUMAIN pilot" \
            --notes-file docs/releases/RELEASE_NOTES_v0.0.3-rc.1.md \
            --prerelease --latest=false --repo "$GITHUB_REPOSITORY"
