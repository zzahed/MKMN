name: ci

# Runs on every pull request and on every push to main. Read-only: it never publishes anything.
# Each action is pinned to a commit; the comment beside it names the version that commit is.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-type:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with: { version: 10.26.1 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 26, cache: pnpm }
      - run: pnpm --ignore-workspace install --frozen-lockfile
      - run: pnpm rebuild esbuild
      - run: pnpm typecheck
      - run: node scripts/check-language.mjs
      - run: pnpm regen:check
      - run: pnpm lint

  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix: { shard: [1, 2, 3] }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with: { version: 10.26.1 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 26, cache: pnpm }
      - run: pnpm --ignore-workspace install --frozen-lockfile
      - run: pnpm rebuild esbuild
      # coverage is checked in windows-arm64-tests: its thresholds need the whole suite in one run
      - run: pnpm exec vitest run --shard=${{ matrix.shard }}/3 --reporter=default --reporter=junit --outputFile.junit=reports/junit-${{ matrix.shard }}.xml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: unit-${{ matrix.shard }}
          path: reports/
          retention-days: 30

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with: { version: 10.26.1 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 26, cache: pnpm }
      - run: pnpm --ignore-workspace install --frozen-lockfile
      - run: pnpm rebuild esbuild
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec playwright test --trace off
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: e2e
          path: |
            reports/
            test-results/
          retention-days: 30

  windows-arm64-tests:
    runs-on: windows-11-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with: { version: 10.26.1 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 26, cache: pnpm }
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with: { toolchain: 1.100.0, targets: aarch64-pc-windows-msvc, components: clippy }
      - shell: pwsh
        run: |
          pnpm --ignore-workspace install --frozen-lockfile; if ($LASTEXITCODE) { exit $LASTEXITCODE }
          pnpm rebuild esbuild;                              if ($LASTEXITCODE) { exit $LASTEXITCODE }
          pnpm run build;                                    if ($LASTEXITCODE) { exit $LASTEXITCODE }
          pnpm run build:sidecar;                            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $env:MKMN_REQUIRE_SIDECAR = "1"
          pnpm test --coverage;                              if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo clippy --manifest-path src-tauri/Cargo.toml --target aarch64-pc-windows-msvc -- -D warnings; if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo test   --manifest-path src-tauri/Cargo.toml --target aarch64-pc-windows-msvc;              exit $LASTEXITCODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: coverage
          path: |
            coverage/coverage-summary.json
            coverage/lcov.info
          retention-days: 30

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with: { version: 10.26.1 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 26 }
      - run: pnpm audit --audit-level=high
      - run: cargo install cargo-audit --locked && cargo audit --file src-tauri/Cargo.lock
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
